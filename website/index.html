<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>JugaPlatform — Corre, salta y rompe tu récord</title>
    <meta name="description" content="JugaPlatform es un runner arcade latino: salta obstáculos, recoge estrellas y supera tu mejor distancia." />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="hero">
      <section class="card">
        <p class="kicker">Nuevo juego móvil</p>
        <h1>JugaPlatform</h1>
        <p class="subtitle">
          Un runner rápido, ligero y adictivo. Esquiva obstáculos, recoge estrellas y domina la ruta.
        </p>

        <div class="buttons">
          <a
            class="btn btn-primary"
            href="intent://jugalatamgame.com/play#Intent;scheme=https;package=com.jugaplatform;S.browser_fallback_url=https%3A%2F%2Fplay.google.com%2Fstore%2Fapps%2Fdetails%3Fid%3Dcom.jugaplatform;end"
          >
            Abrir juego
          </a>
          <a
            class="btn btn-secondary"
            href="https://play.google.com/store/apps/details?id=com.jugaplatform"
            target="_blank"
            rel="noopener noreferrer"
          >
            Ver en Google Play
          </a>
        </div>

        <ul class="features">
          <li>🏃 Runner arcade inspirado en el clásico del navegador</li>
          <li>🌵 Obstáculos + bonus de estrellas</li>
          <li>🏆 Ranking y récord personal por distancia</li>
        </ul>
      </section>
    </main>
  </body>
</html>
